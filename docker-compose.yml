services:
  docs:
    build:
      context: .
      args:
        # Set by scripts/auto_update.sh at deploy time.
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-dev}
    container_name: autotournament-docs
    restart: unless-stopped
    ports:
      # The astro Cloudflare tunnel routes docs.autotournament.gg to dev.lan:31235.
      # Its connectors run on several LAN hosts, so bind on all interfaces.
      - "0.0.0.0:31235:3000"
